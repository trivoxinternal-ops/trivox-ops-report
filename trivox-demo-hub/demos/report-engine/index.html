  <style>
    :root{--blue:#2E61FE;--cyan:#00F0FF;--bg:#050508;--card:rgba(255,255,255,0.04);--border:rgba(0,240,255,0.25);--border-dim:#1a1a1a;--text:#E8E8E8;--text-muted:#777;--text-dim:#999;--success:#22C55E;--danger:#EF4444;--warning:#F59E0B;--gradient:linear-gradient(135deg,#2E61FE 0%,#00F0FF 100%);--radius:14px;--radius-lg:24px;--radius-sm:8px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    #bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .shell{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;position:relative;z-index:50}
    .header img{height:26px;width:auto}
    .header-badge{font-size:10px;font-weight:600;color:var(--cyan);letter-spacing:0.06em;text-transform:uppercase;padding:5px 14px;border:1px solid rgba(0,240,255,0.15);border-radius:20px;background:rgba(0,240,255,0.04)}

    /* Upload Screen */
    .upload-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 24px 60px;background:radial-gradient(ellipse at 50% 40%,rgba(46,97,254,0.1) 0%,rgba(0,240,255,0.04) 40%,transparent 70%)}
    .upload-card{width:100%;max-width:620px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px 40px;backdrop-filter:blur(16px);box-shadow:0 0 80px rgba(46,97,254,0.1),inset 0 1px 0 rgba(255,255,255,0.06)}
    .upload-title{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fff 60%,#00F0FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.25;margin-bottom:4px}
    .upload-sub{color:var(--text-muted);font-size:0.85rem;margin-bottom:28px;line-height:1.6}

    /* Drop zone */
    .drop-zone{border:2px dashed rgba(0,240,255,0.25);border-radius:16px;padding:48px 24px;text-align:center;cursor:pointer;transition:all 0.3s ease;background:rgba(0,0,0,0.2);margin-bottom:20px}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--cyan);background:rgba(0,240,255,0.04);box-shadow:0 0 40px rgba(0,240,255,0.08)}
    .drop-icon{width:48px;height:48px;border-radius:50%;background:rgba(46,97,254,0.1);border:1px solid rgba(46,97,254,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .drop-icon svg{width:22px;height:22px}
    .drop-text{font-size:0.9rem;font-weight:600;color:var(--text);margin-bottom:4px}
    .drop-hint{font-size:0.78rem;color:#555}

    /* File list */
    .file-list{list-style:none;margin-bottom:20px}
    .file-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid var(--border-dim);border-radius:10px;margin-bottom:8px;font-size:13px}
    .file-info{display:flex;align-items:center;gap:10px;color:var(--text);min-width:0}
    .file-info .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .file-info .size{color:#555;flex-shrink:0}
    .file-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase}
    .file-icon.pdf{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2)}
    .file-icon.docx{background:rgba(46,97,254,0.1);color:var(--blue);border:1px solid rgba(46,97,254,0.2)}
    .file-icon.txt{background:rgba(0,240,255,0.08);color:var(--cyan);border:1px solid rgba(0,240,255,0.2)}
    .file-remove{background:none;border:none;color:#555;cursor:pointer;padding:4px;transition:color 0.2s;font-size:16px}
    .file-remove:hover{color:var(--danger)}

    /* Demo link */
    .demo-link{display:block;text-align:center;color:#555;font-size:0.78rem;margin-bottom:20px;cursor:pointer;transition:color 0.2s;text-decoration:underline;text-underline-offset:3px;background:none;border:none;font-family:'Sora',sans-serif;width:100%}
    .demo-link:hover{color:var(--cyan)}

    .btn-gen{width:100%;padding:15px;background:var(--gradient);border:none;border-radius:12px;font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(46,97,254,0.25)}
    .btn-gen:hover{opacity:0.92;transform:translateY(-1px);box-shadow:0 8px 30px rgba(46,97,254,0.35)}
    .btn-gen:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none}

    /* Loading */
    .loading-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
    .scan-lines{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .scan-line{position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(0,240,255,0.08) 50%,transparent 100%);animation:scanMove 3s ease-in-out infinite}
    .scan-line:nth-child(1){top:25%;animation-delay:0s}
    .scan-line:nth-child(2){top:50%;animation-delay:0.8s}
    .scan-line:nth-child(3){top:75%;animation-delay:1.6s}
    @keyframes scanMove{0%,100%{opacity:0;transform:translateX(-100%)}50%{opacity:1;transform:translateX(100%)}}
    .ld-pulse{width:72px;height:72px;border-radius:50%;position:relative;margin-bottom:36px}
    .ld-pulse::before,.ld-pulse::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
    .ld-pulse::before{border-top-color:var(--cyan);border-right-color:var(--cyan);animation:spin 1.2s linear infinite}
    .ld-pulse::after{border-bottom-color:var(--blue);border-left-color:var(--blue);animation:spin 1.2s linear infinite reverse;inset:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ld-pulse .dot{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,0.4);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:0.5;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
    .ld-status{font-size:1rem;font-weight:600;color:#fff;margin-bottom:6px;text-align:center;position:relative;z-index:1}
    .ld-sub{font-size:13px;color:#444;text-align:center;position:relative;z-index:1}

    /* Error */
    .error-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
    .error-card{text-align:center;max-width:420px;background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 32px}

    .rpt-header{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-dim);animation:fadeUp 0.5s both}

    .rpt-client-name{font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:4px}
    .rpt-meta{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
    .rpt-meta span{color:var(--text-dim)}

    /* Metrics row */
    .metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;animation:fadeUp 0.5s 0.05s both}
    .metric-card{background:var(--card);border:1px solid var(--border-dim);border-radius:var(--radius);padding:16px 18px;text-align:center}

    .kv-key{color:#555;min-width:200px;flex-shrink:0;font-size:12px}
    .kv-val{color:var(--text);font-weight:500}

    .conflict-field{font-size:13px;font-weight:700;color:var(--warning);margin-bottom:4px}
    .conflict-detail{font-size:12px;color:#666;line-height:1.6}

    .confidence-box{background:var(--card);border:1px solid var(--border-dim);border-radius:var(--radius);padding:18px 20px;font-size:13px;color:var(--text-dim);line-height:1.7}

    /* Action bar */
    .rpt-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;animation:fadeUp 0.5s 0.1s both}
    .btn-action{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;font-family:'Sora',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;text-decoration:none}
    .btn-primary{background:var(--gradient);color:#fff;box-shadow:0 3px 14px rgba(46,97,254,0.25)}
    .btn-primary:hover{opacity:0.92;transform:translateY(-1px);box-shadow:0 6px 22px rgba(46,97,254,0.35)}
    .btn-secondary{background:rgba(0,0,0,0.4);color:var(--text);border:1px solid var(--border-dim)}
    .btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}

    .rpt-cta{text-align:center;padding:36px 24px;background:var(--card);border:1px solid var(--border-dim);border-radius:var(--radius);margin-top:8px;animation:fadeUp 0.5s 0.6s both}
    .rpt-cta h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
    .rpt-cta p{color:var(--text-muted);font-size:0.82rem;margin-bottom:20px;line-height:1.5}

    .btn-new{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:none;border:none;color:#555;font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;transition:color 0.2s}
    .btn-new:hover{color:var(--cyan)}

    /* Footer */
    .footer{text-align:center;padding:16px 24px;font-size:10px;color:#333;position:relative;z-index:1}

    /* Print */
    @media print{
      body{background:#fff;color:#111}
      #bgCanvas,.header,.footer,.rpt-cta,.rpt-actions,.btn-new{display:none!important}
      .report{padding:0;max-width:100%}
      .rpt-header{border-color:#ddd}
      .rpt-label{color:#2E61FE}
      .rpt-client-name{color:#111}
      .rpt-meta,.rpt-meta span{color:#555}
      .rpt-section-title{color:#2E61FE}
      .rpt-section-title .bar{background:#ddd}
      .kv-grid,.item-card,.metric-card,.rpt-table,.confidence-box{background:#f9f9f9;border-color:#ddd}
      .kv-val,.item-title,.rpt-table td{color:#222}
      .metric-val{-webkit-text-fill-color:#2E61FE}
    }

    /* Responsive */
    @media(max-width:600px){
      .header{padding:16px 18px}
      .upload-card{padding:32px 22px}
      .report{padding:20px 14px 40px}
      .header-badge{display:none}
      .kv-row{flex-direction:column;gap:2px}
      .kv-key{min-width:0}
      .metrics-row{grid-template-columns:1fr 1fr}
    }
  </style>

// ── File Parsing ──────────────────────────
async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item => item.str).join(' ') + '\n';
  }
  return text;
}

async function parseDOCX(file) {
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value;
}

async function parseTXT(file) {
  return await file.text();
}

async function parseFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) return await parsePDF(file);
  if (name.endsWith('.docx')) return await parseDOCX(file);
  if (name.endsWith('.txt')) return await parseTXT(file);
  return await file.text();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function getExt(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  return 'txt';
}

function setupDragDrop() {
  const dz = document.getElementById('dropZone');
  if (!dz) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
}

function handleFiles(fileListObj) {
  const allowed = ['pdf', 'docx', 'txt'];
  for (const file of fileListObj) {
    const ext = getExt(file.name);
    if (allowed.includes(ext) && uploadedFiles.length < 10) {
      uploadedFiles.push(file);
    }
  }
  updateFileList();
}

function removeFile(idx) {
  uploadedFiles.splice(idx, 1);
  updateFileList();
}

function updateFileList() {
  const list = document.getElementById('fileList');
  const btn = document.getElementById('btnGenerate');
  if (!list || !btn) return;

  if (uploadedFiles.length === 0) {
    list.innerHTML = '';
    btn.disabled = true;
    return;
  }

  list.innerHTML = uploadedFiles.map((f, i) => {
    const ext = getExt(f.name);
    return `
      <li class="file-item">
        <div class="file-info">
          <div class="file-icon ${ext}">${ext}</div>
          <span class="name">${esc(f.name)}</span>
          <span class="size">${formatSize(f.size)}</span>
        </div>
        <button class="file-remove" onclick="removeFile(${i})">&times;</button>
      </li>
    `;
  }).join('');
  btn.disabled = false;
}

// ── Generate ──────────────────────────────
async function generateReport() {
  const documents = [];
  for (const file of uploadedFiles) {
    const text = await parseFile(file);
    const label = file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    documents.push({ label, source: file.name, text });
  }
  docCount = documents.length;
  renderLoading();
  fetchReport(documents);
}

async function runDemo() {
  docCount = SAMPLE_DOCS.length;
  renderLoading();
  fetchReport(SAMPLE_DOCS);
}

async function fetchReport(documents) {
  const start = Date.now();
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documents })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || `Error ${res.status}`);
    }
    const data = await res.json();
    const elapsed = ((Date.now() - start) / 1000).toFixed(1);
    renderReport(data, elapsed);
  } catch (err) {
    renderError(err.message);
  }
}

// ── PDF Download ──────────────────────────
function downloadPDF() {
  if (!reportData) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const r = reportData;
  const cp = r.client_profile || {};
  const fs = r.financial_situation || {};
  const ic = r.insurance_coverage || {};
  const gaps = r.identified_gaps || [];
  const steps = r.recommended_next_steps || [];
  const ep = r.estate_planning || {};
  const conflicts = r.data_conflicts || [];
  const inc = cp.annual_income || {};
  const sp = cp.spouse || {};
  const re = fs.real_estate || {};

  const pageW = 210;
  const margin = 18;
  const contentW = pageW - margin * 2;
  let y = 20;

  const blue = [46, 97, 254];
  const dark = [15, 17, 30];
  const muted = [122, 122, 158];
  const textColor = [30, 30, 50];

  function checkPage(needed) {
    if (y + needed > 275) { doc.addPage(); y = 20; }
  }

  function sectionTitle(title) {
    checkPage(14);
    y += 6;
    doc.setFontSize(11);
    doc.setTextColor(...blue);
    doc.setFont('helvetica', 'bold');
    doc.text(title.toUpperCase(), margin, y);
    y += 2;
    doc.setDrawColor(200, 200, 210);
    doc.line(margin, y, pageW - margin, y);
    y += 6;
  }

  function kvLine(key, val) {
    checkPage(7);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...muted);
    doc.text(key, margin, y);
    doc.setTextColor(...textColor);
    doc.setFont('helvetica', 'bold');
    const valStr = val != null ? String(val) : '—';
    const lines = doc.splitTextToSize(valStr, contentW - 55);
    doc.text(lines, margin + 55, y);
    y += Math.max(lines.length * 4.5, 5);
  }

  // Cover
  doc.setFillColor(...dark);
  doc.rect(0, 0, pageW, 80, 'F');
  doc.setFontSize(22);
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.text('TRIVOX AI', pageW / 2, 35, { align: 'center' });
  doc.setFontSize(12);
  doc.setTextColor(...muted);
  doc.setFont('helvetica', 'normal');
  doc.text('Client Summary Report', pageW / 2, 45, { align: 'center' });
  doc.setFontSize(14);
  doc.setTextColor(...textColor);
  doc.setFont('helvetica', 'bold');
  doc.text(cp.full_name || 'Client Report', pageW / 2, 65, { align: 'center' });
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...muted);
  const now = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  doc.text(`Generated: ${now}`, pageW / 2, 72, { align: 'center' });

  y = 90;

  // Client Profile
  sectionTitle('Client Profile');
  let spouseStr = sp.name || 'N/A';
  if (sp.age) spouseStr += `, age ${sp.age}`;
  if (sp.employer) spouseStr += ` — ${sp.employer}`;

  kvLine('Full Name', cp.full_name);
  kvLine('DOB / Age', `${cp.date_of_birth || '?'} (${cp.age || '?'})`);
  kvLine('Citizenship', cp.citizenship);
  kvLine('Marital Status', cp.marital_status);
  kvLine('Spouse', spouseStr);
  kvLine('Dependents', (cp.dependents||[]).map(d=>`${d.name} (${d.age})`).join(', ') || 'None');
  kvLine('Address', cp.address);
  kvLine('Phone / Email', `${cp.phone || '?'} / ${cp.email || '?'}`);
  kvLine('Employer', `${cp.employer || '?'} — ${cp.job_title || '?'}`);
  kvLine('Base Salary', fmtCurPlain(inc.base_salary));
  kvLine('Household Income', fmtCurPlain(inc.total_household));

  // Financial Snapshot
  sectionTitle('Financial Snapshot');
  kvLine('Liquid Savings', fmtCurPlain(fs.liquid_savings));
  kvLine('Net Worth', fmtCurPlain(fs.estimated_net_worth));
  kvLine('Risk Tolerance', fs.risk_tolerance);
  (fs.registered_accounts||[]).forEach(a => {
    kvLine(a.type || 'Account', `${fmtCurPlain(a.balance)} — ${a.institution || '?'}`);
  });
  kvLine('Property', `${fmtCurPlain(re.estimated_value)} (mtg: ${fmtCurPlain(re.mortgage_balance)})`);

  // Insurance
  sectionTitle('Insurance Coverage');
  (ic.life_insurance||[]).forEach(p => kvLine(`Life — ${p.type}`, `${fmtCurPlain(p.face_value)} — ${p.provider || '?'}`));
  (ic.disability||[]).forEach(d => kvLine(`Disability — ${d.type}`, `${d.benefit_pct} for ${d.duration}`));
  const hdv2 = ic.health_dental_vision || {};
  if (hdv2.provider) kvLine('Health/Dental', `${hdv2.provider} — ${fmtCurPlain(hdv2.monthly_cost)}/mo`);

  // Estate
  sectionTitle('Estate Planning');
  kvLine('Wills', ep.wills);
  kvLine('POA (Property)', ep.power_of_attorney_property);
  kvLine('POA (Personal Care)', ep.power_of_attorney_personal_care);
  kvLine('Beneficiaries', ep.beneficiary_designations);

  // Gaps
  sectionTitle('Identified Gaps');
  gaps.forEach((g, i) => {
    checkPage(10);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...textColor);
    const gapText = `[${(g.priority||'').toUpperCase()}] [${g.category}] ${g.issue}`;
    const gapLines = doc.splitTextToSize(gapText, contentW);
    doc.text(gapLines, margin, y);
    y += gapLines.length * 4.5;
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...muted);
    doc.setFontSize(8);
    doc.text(`Impact: ${g.impact || '—'}`, margin, y);
    y += 6;
  });

  // Next Steps
  sectionTitle('Recommended Next Steps');
  steps.forEach((s, i) => {
    checkPage(12);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...textColor);
    const stepText = `${i + 1}. [${(s.priority||'').toUpperCase()}] ${s.action}`;
    const stepLines = doc.splitTextToSize(stepText, contentW);
    doc.text(stepLines, margin, y);
    y += stepLines.length * 4.5;
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...muted);
    doc.setFontSize(8);
    const ratLines = doc.splitTextToSize(`${s.rationale || ''} | Timeline: ${s.timeline || 'N/A'}`, contentW);
    doc.text(ratLines, margin, y);
    y += ratLines.length * 4 + 4;
  });

  // Conflicts
  if (conflicts.length) {
    sectionTitle('Data Conflicts');
    conflicts.forEach(c => {
      checkPage(10);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...textColor);
      doc.text(c.field || '?', margin, y);
      y += 4.5;
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...muted);
      doc.setFontSize(8);
      const cLines = doc.splitTextToSize(`${c.doc1_value} vs ${c.doc2_value} → ${c.resolved_to} — ${c.reasoning}`, contentW);
      doc.text(cLines, margin, y);
      y += cLines.length * 4 + 4;
    });
  }

  // Footer on all pages
  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFontSize(7);
    doc.setTextColor(...muted);
    doc.text('Confidential — Generated by Trivox AI', pageW / 2, 290, { align: 'center' });
    doc.text(`Page ${p} of ${totalPages}`, pageW - margin, 290, { align: 'right' });
  }

  const fileName = `client_report_${cp.full_name ? cp.full_name.replace(/\s+/g, '_') : 'report'}_${new Date().toISOString().slice(0,10)}.pdf`;
  doc.save(fileName);
}

// ── Helpers ───────────────────────────────
function esc(s) { if (s == null) return '—'; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function fmtCur(v) { if (v == null) return 'N/A'; if (typeof v === 'string') return v; return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function fmtCurPlain(v) { if (v == null) return 'N/A'; if (typeof v === 'string') return v; return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function badge(level) { if (!level) return ''; return `<span class="badge badge-${level.toLowerCase()}">${level.toUpperCase()}</span>`; }
function kv(key, val) { return `<div class="kv-row"><span class="kv-key">${esc(key)}</span><span class="kv-val">${esc(val)}</span></div>`; }
function section(title, delay) {
  return `<div class="rpt-section" style="animation:fadeUp 0.5s ${delay}s both">
    <div class="rpt-section-title">${esc(title)} <div class="bar"></div></div>`;
}

// ── Particles ─────────────────────────────
(function(){
  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');let w,h,pts=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  function init(){pts=[];const n=Math.floor((w*h)/12000);for(let i=0;i<n;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,r:Math.random()*1+0.4,a:Math.random()*0.15+0.04})}
  function draw(){ctx.clearRect(0,0,w,h);pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=(i%2===0)?`rgba(46,97,254,${p.a})`:`rgba(0,240,255,${p.a})`;ctx.fill()});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;if(d<10000){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(46,97,254,${0.04*(1-d/10000)})`;ctx.lineWidth=0.5;ctx.stroke()}}requestAnimationFrame(draw)}
  resize();init();draw();window.addEventListener('resize',()=>{resize();init()})
})();

// ── Boot ──────────────────────────────────
renderUpload();
</script>
